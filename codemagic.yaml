workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.aistudio.gnzmon.wqrk"
      groups:
        - google_credentials
        # Defines GNZ_MON_BACKEND_ENDPOINT and GNZ_MON_BACKEND_HEALTH_ENDPOINT for the deployed service.
        - backend_config
    scripts:
      - name: Bootstrap Gradle 9.3.1
        script: |
          set -euo pipefail
          GRADLE_VERSION="9.3.1"
          TOOLS_DIR="$CM_BUILD_DIR/.tools"
          TEMP_DIR="$(mktemp -d)"
          ARCHIVE="$TEMP_DIR/gradle-${GRADLE_VERSION}-bin.zip"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          mkdir -p "$TOOLS_DIR"
          curl --fail --location \
            --output "$ARCHIVE" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$ARCHIVE" -d "$TOOLS_DIR"

          GRADLE_BIN="$TOOLS_DIR/gradle-${GRADLE_VERSION}/bin/gradle"
          test -x "$GRADLE_BIN"
          printf 'GRADLE_BIN=%s\n' "$GRADLE_BIN" >> "$CM_ENV"
      - name: Verify deployed backend health
        script: |
          set -euo pipefail
          : "${GNZ_MON_BACKEND_ENDPOINT:?Set the deployed identify endpoint in backend_config}"
          : "${GNZ_MON_BACKEND_HEALTH_ENDPOINT:?Set the image-free health endpoint in backend_config}"
          case "$GNZ_MON_BACKEND_ENDPOINT" in
            https://*/v1/species/identify) ;;
            *) echo "GNZ_MON_BACKEND_ENDPOINT must be the deployed HTTPS identify route" >&2; exit 1 ;;
          esac
          case "$GNZ_MON_BACKEND_HEALTH_ENDPOINT" in https://*) ;; *) exit 1 ;; esac
          curl --fail --silent --show-error --retry 3 --max-time 15 "$GNZ_MON_BACKEND_HEALTH_ENDPOINT" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
      - name: Build Android Release APK
        script: |
          set -euo pipefail
          : "${GRADLE_BIN:?GRADLE_BIN was not restored from the bootstrap step}"
          test -x "$GRADLE_BIN"
          ASSEMBLE_LOG="$CM_BUILD_DIR/assemble-release.log"

          set +e
          "$GRADLE_BIN" :app:assembleRelease --no-daemon --stacktrace --console=plain \
            "-PGNZ_MON_BACKEND_ENDPOINT=$GNZ_MON_BACKEND_ENDPOINT" 2>&1 | tee "$ASSEMBLE_LOG"
          GRADLE_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          rg -n -C 10 'e:|error:|\.kt' "$ASSEMBLE_LOG" || true
          exit "$GRADLE_EXIT_CODE"
    artifacts:
      - app/build/outputs/apk/release/app-release.apk
      - $CM_BUILD_DIR/assemble-release.log
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
