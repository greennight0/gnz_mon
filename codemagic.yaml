workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.aistudio.gnzmon.wqrk"
      groups:
        - google_credentials
    scripts:
      - name: Set up environment and permissions
        script: |
          chmod +x gradlew || true
      - name: Build Android Debug APK
        script: |
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Build Android Release APK (Optional)
        script: |
          gradle :app:assembleRelease --no-daemon --stacktrace || true
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
