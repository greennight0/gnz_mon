workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.aistudio.gnzmon.wqrk"
      groups:
        - google_credentials
    scripts:
      - name: Bootstrap Gradle 9.3.1
        script: |
          set -euo pipefail
          GRADLE_VERSION="9.3.1"
          TOOLS_DIR="$CM_BUILD_DIR/.tools"
          TEMP_DIR="$(mktemp -d)"
          ARCHIVE="$TEMP_DIR/gradle-${GRADLE_VERSION}-bin.zip"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          mkdir -p "$TOOLS_DIR"
          curl --fail --location \
            --output "$ARCHIVE" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$ARCHIVE" -d "$TOOLS_DIR"

          GRADLE_BIN="$TOOLS_DIR/gradle-${GRADLE_VERSION}/bin/gradle"
          test -x "$GRADLE_BIN"
          export GRADLE_BIN
          echo "export GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"
      - name: Build Android Debug APK
        script: |
          "$GRADLE_BIN" :app:assembleDebug --no-daemon --stacktrace
      - name: Build Android Release APK (Optional)
        script: |
          "$GRADLE_BIN" :app:assembleRelease --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
